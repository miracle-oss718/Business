<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maison Hair — Admin Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        :root {
            --black: #0b0b0b;
            --black-soft: #121212;
            --white: #f1eee8;
            --white-soft: #d8d4cc;
            --grey: #858585;
            --border: rgba(255,255,255,.09);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255,255,255,.045),
                    transparent 40%
                ),
                var(--black);

            color: var(--white);
            font-family: "DM Sans", sans-serif;
        }

        .login-shell {
            width: min(420px, 100%);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-mark {
            width: 52px;
            height: 52px;
            margin: 0 auto 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background: rgba(255,255,255,.055);
            border: 1px solid var(--border);

            color: var(--white);
            font-family: "Manrope", sans-serif;
            font-size: 18px;
            font-weight: 700;

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.05),
                0 15px 40px rgba(0,0,0,.3);
        }

        .brand h1 {
            font-family: "Manrope", sans-serif;
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -.5px;
        }

        .brand p {
            margin-top: 6px;
            color: var(--grey);
            font-size: 11px;
        }

        .login-card {
            padding: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(29,29,29,.96),
                    rgba(15,15,15,.98)
                );

            border: 1px solid var(--border);
            border-radius: 20px;

            box-shadow:
                0 30px 90px rgba(0,0,0,.55),
                inset 0 1px 0 rgba(255,255,255,.035);
        }

        .login-card h2 {
            font-family: "Manrope", sans-serif;
            font-size: 20px;
            letter-spacing: -.4px;
        }

        .login-card > p {
            margin-top: 7px;
            margin-bottom: 24px;

            color: var(--grey);
            font-size: 11px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;

            color: var(--white-soft);
            font-size: 10px;
            font-weight: 600;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);

            color: var(--grey);
            font-size: 12px;
        }

        .input-wrap input {
            width: 100%;
            height: 46px;

            padding: 0 14px 0 40px;

            border: 1px solid rgba(255,255,255,.08);
            border-radius: 10px;

            outline: none;

            background: rgba(255,255,255,.035);

            color: var(--white);

            font-family: inherit;
            font-size: 12px;

            transition:
                border-color .2s ease,
                background .2s ease;
        }

        .input-wrap input:focus {
            border-color: rgba(255,255,255,.22);
            background: rgba(255,255,255,.05);
        }

        .input-wrap input::placeholder {
            color: #606060;
        }

        .login-btn {
            width: 100%;
            height: 46px;

            margin-top: 8px;

            border: 1px solid rgba(255,255,255,.12);
            border-radius: 10px;

            background: var(--white);
            color: var(--black);

            font-family: inherit;
            font-size: 11px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform .2s ease,
                opacity .2s ease;
        }

        .login-btn:hover {
            opacity: .9;
        }

        .login-btn:active {
            transform: scale(.98);
        }

        .login-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .error-message {
            display: none;

            margin-bottom: 15px;
            padding: 11px 12px;

            border: 1px solid rgba(255,90,90,.18);
            border-radius: 9px;

            background: rgba(255,70,70,.055);
            color: #ff9a9a;

            font-size: 10px;
            line-height: 1.5;
        }

        .error-message.active {
            display: block;
        }

        .login-footer {
            margin-top: 20px;

            text-align: center;

            color: #555;
            font-size: 9px;
        }
        
        .forgot-password-btn {
    display: block;

    margin: 8px 0 0 auto;
    padding: 0;

    border: none;
    background: transparent;

    color: var(--grey);

    font-family: inherit;
    font-size: 10px;
    font-weight: 500;

    cursor: pointer;

    transition:
        color .2s ease,
        opacity .2s ease;
}

.forgot-password-btn:hover {
    color: var(--white-soft);
}

.forgot-password-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

        @media (max-width: 480px) {
            .login-card {
                padding: 23px 19px;
                border-radius: 17px;
            }
        }
    </style>
</head>

<body>

    <main class="login-shell">

        <div class="brand">
            <div class="brand-mark">MH</div>

            <h1>Maison Hair</h1>

            <p>Administration Portal</p>
        </div>

        <div class="login-card">

            <h2>Welcome back</h2>

            <p>
                Sign in to manage appointments, payments and customer activity.
            </p>

            <div
                class="error-message"
                id="loginError"
            ></div>

            <form id="loginForm">

                <div class="field">

                    <label for="email">
                        EMAIL ADDRESS
                    </label>

                    <div class="input-wrap">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="admin@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>

<div class="field">

    <label for="password">
        PASSWORD
    </label>

    <div class="input-wrap">

        <i class="fa-solid fa-lock"></i>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

    </div>

    <button
        type="button"
        class="forgot-password-btn"
        id="forgotPasswordBtn"
    >
        Forgot password?
    </button>

</div>

                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >
                    Sign in
                </button>

            </form>

        </div>

        <div class="login-footer">
            Maison Hair Admin · Secure access
        </div>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="login.js"></script>

</body>
</html>
