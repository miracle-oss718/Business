<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>Maison Hair — Reset Password</title>


    <!-- Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Icons -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <style>

        :root {

            --black: #0b0b0b;
            --black-soft: #121212;
            --black-card: #151515;

            --white: #f1eee8;
            --white-soft: #d8d4cc;

            --grey: #858585;
            --grey-dark: #555;

            --success: #a8d8b0;
            --success-bg: rgba(100, 190, 115, .06);
            --success-border: rgba(100, 190, 115, .18);

            --error: #ff9a9a;
            --error-bg: rgba(255, 70, 70, .055);
            --error-border: rgba(255, 90, 90, .18);

            --border: rgba(255,255,255,.09);

        }


        * {

            box-sizing: border-box;

            margin: 0;
            padding: 0;

        }


        html {

            min-height: 100%;

        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 24px;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255,255,255,.05),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    rgba(255,255,255,.025),
                    transparent 35%
                ),
                var(--black);

            color: var(--white);

            font-family:
                "DM Sans",
                sans-serif;

        }


        button,
        input {

            font-family: inherit;

        }


        /* =========================
           SHELL
        ========================= */

        .reset-shell {

            width:
                min(420px, 100%);

        }


        /* =========================
           BRAND
        ========================= */

        .brand {

            text-align: center;

            margin-bottom: 28px;

        }


        .brand-mark {

            width: 54px;
            height: 54px;

            margin:
                0 auto 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.07),
                    rgba(255,255,255,.025)
                );

            border:
                1px solid
                rgba(255,255,255,.10);

            color: var(--white);

            font-family:
                "Manrope",
                sans-serif;

            font-size: 17px;
            font-weight: 700;

            letter-spacing: -.5px;

            box-shadow:
                inset
                0 1px 0
                rgba(255,255,255,.06),

                0 18px 45px
                rgba(0,0,0,.32);

        }


        .brand h1 {

            font-family:
                "Manrope",
                sans-serif;

            font-size: 21px;

            font-weight: 700;

            letter-spacing: -.6px;

        }


        .brand p {

            margin-top: 6px;

            color: var(--grey);

            font-size: 10px;

            letter-spacing: .1px;

        }


        /* =========================
           CARD
        ========================= */

        .reset-card {

            padding: 29px;

            background:
                linear-gradient(
                    145deg,
                    rgba(29,29,29,.96),
                    rgba(14,14,14,.985)
                );

            border:
                1px solid
                var(--border);

            border-radius: 20px;

            box-shadow:

                0 30px 90px
                rgba(0,0,0,.55),

                inset
                0 1px 0
                rgba(255,255,255,.035);

            backdrop-filter:
                blur(16px);

        }


        .reset-header {

            margin-bottom: 24px;

        }


        .reset-header h2 {

            font-family:
                "Manrope",
                sans-serif;

            font-size: 20px;

            font-weight: 700;

            letter-spacing: -.5px;

        }


        .reset-header p {

            margin-top: 7px;

            color: var(--grey);

            font-size: 11px;

            line-height: 1.65;

        }


        /* =========================
           LINK STATUS
        ========================= */

        .link-status {

            display: flex;

            align-items: center;

            gap: 9px;

            margin-bottom: 18px;

            padding: 10px 12px;

            border:
                1px solid
                rgba(255,255,255,.07);

            border-radius: 9px;

            background:
                rgba(255,255,255,.025);

            color: var(--grey);

            font-size: 10px;

            line-height: 1.4;

        }


        .link-status i {

            font-size: 11px;

        }


        .link-status.ready {

            color: var(--success);

            border-color:
                var(--success-border);

            background:
                var(--success-bg);

        }


        .link-status.error {

            color: var(--error);

            border-color:
                var(--error-border);

            background:
                var(--error-bg);

        }


        /* =========================
           MESSAGE
        ========================= */

        .message {

            display: none;

            margin-bottom: 16px;

            padding: 11px 12px;

            border-radius: 9px;

            font-size: 10px;

            line-height: 1.5;

        }


        .message.active {

            display: flex;

            align-items: flex-start;

            gap: 9px;

        }


        .message i {

            margin-top: 1px;

            font-size: 11px;

        }


        .message.error {

            border:
                1px solid
                var(--error-border);

            background:
                var(--error-bg);

            color:
                var(--error);

        }


        .message.success {

            border:
                1px solid
                var(--success-border);

            background:
                var(--success-bg);

            color:
                var(--success);

        }


        /* =========================
           FIELDS
        ========================= */

        .field {

            margin-bottom: 17px;

        }


        .field-label {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 7px;

        }


        .field-label label {

            color: var(--white-soft);

            font-size: 10px;

            font-weight: 600;

        }


        .input-wrap {

            position: relative;

        }


        .input-icon {

            position: absolute;

            left: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            color: var(--grey);

            font-size: 12px;

            pointer-events: none;

        }


        .input-wrap input {

            width: 100%;

            height: 47px;

            padding:
                0 44px 0 40px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 10px;

            outline: none;

            background:
                rgba(255,255,255,.035);

            color: var(--white);

            font-size: 12px;

            transition:
                border-color .2s ease,
                background .2s ease,
                box-shadow .2s ease;

        }


        .input-wrap input:hover {

            border-color:
                rgba(255,255,255,.13);

        }


        .input-wrap input:focus {

            border-color:
                rgba(255,255,255,.22);

            background:
                rgba(255,255,255,.05);

            box-shadow:
                0 0 0 3px
                rgba(255,255,255,.025);

        }


        .input-wrap input::placeholder {

            color: #606060;

        }


        .input-wrap input:disabled {

            opacity: .5;

            cursor: not-allowed;

        }


        /* =========================
           PASSWORD TOGGLE
        ========================= */

        .password-toggle {

            position: absolute;

            right: 12px;

            top: 50%;

            transform:
                translateY(-50%);

            width: 27px;
            height: 27px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: none;

            background: transparent;

            color: var(--grey);

            cursor: pointer;

            border-radius: 6px;

            transition:
                color .2s ease,
                background .2s ease;

        }


        .password-toggle:hover {

            color: var(--white-soft);

            background:
                rgba(255,255,255,.05);

        }


        /* =========================
           PASSWORD STRENGTH
        ========================= */

        .strength {

            margin-top: 8px;

        }


        .strength-bars {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 4px;

        }


        .strength-bar {

            height: 3px;

            border-radius: 99px;

            background:
                rgba(255,255,255,.08);

            transition:
                background .2s ease;

        }


        .strength-label {

            margin-top: 6px;

            color: var(--grey);

            font-size: 9px;

        }


        /* =========================
           BUTTON
        ========================= */

        .reset-btn {

            width: 100%;

            height: 47px;

            margin-top: 5px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius: 10px;

            background:
                var(--white);

            color:
                var(--black);

            font-size: 11px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform .2s ease,
                opacity .2s ease,
                box-shadow .2s ease;

        }


        .reset-btn:hover:not(:disabled) {

            opacity: .92;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.25);

        }


        .reset-btn:active:not(:disabled) {

            transform:
                scale(.985);

        }


        .reset-btn:disabled {

            opacity: .42;

            cursor: not-allowed;

        }


        .reset-btn .spinner {

            width: 12px;
            height: 12px;

            border:
                2px solid
                rgba(0,0,0,.2);

            border-top-color:
                var(--black);

            border-radius: 50%;

            animation:
                spin .7s linear infinite;

        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================
           BACK TO LOGIN
        ========================= */

        .back-login {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 18px;

            color: var(--grey);

            font-size: 10px;

            text-decoration: none;

            transition:
                color .2s ease;

        }


        .back-login:hover {

            color: var(--white);

        }


        .back-login i {

            font-size: 9px;

        }


        /* =========================
           FOOTER
        ========================= */

        .login-footer {

            margin-top: 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 6px;

            color: #555;

            font-size: 9px;

        }


        .login-footer i {

            font-size: 8px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            body {

                padding: 18px;

            }


            .brand {

                margin-bottom: 23px;

            }


            .reset-card {

                padding:
                    23px 19px;

                border-radius: 17px;

            }


            .reset-header h2 {

                font-size: 19px;

            }

        }

    </style>

</head>


<body>


    <main class="reset-shell">


        <!-- BRAND -->

        <div class="brand">

            <div class="brand-mark">
                MH
            </div>

            <h1>
                Maison Hair
            </h1>

            <p>
                Administration Portal
            </p>

        </div>


        <!-- CARD -->

        <section class="reset-card">


            <div class="reset-header">

                <h2>
                    Create a new password
                </h2>

                <p>
                    Choose a new password for your Maison Hair administrator account.
                </p>

            </div>


            <!-- LINK STATUS -->

            <div
                class="link-status"
                id="linkStatus"
            >

                <i
                    class="fa-solid fa-circle-notch fa-spin"
                ></i>

                <span id="linkStatusText">
                    Verifying your password reset link...
                </span>

            </div>


            <!-- MESSAGE -->

            <div
                class="message"
                id="resetMessage"
            >

                <i
                    id="messageIcon"
                    class="fa-solid fa-circle-exclamation"
                ></i>

                <span
                    id="messageText"
                ></span>

            </div>


            <!-- FORM -->

            <form
                id="resetForm"
                novalidate
            >


                <!-- NEW PASSWORD -->

                <div class="field">

                    <div class="field-label">

                        <label for="newPassword">
                            NEW PASSWORD
                        </label>

                    </div>


                    <div class="input-wrap">

                        <i
                            class="input-icon fa-solid fa-lock"
                        ></i>


                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            minlength="8"
                            disabled
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            data-target="newPassword"
                            aria-label="Show password"
                            disabled
                        >

                            <i
                                class="fa-solid fa-eye"
                            ></i>

                        </button>

                    </div>


                    <div class="strength">

                        <div class="strength-bars">

                            <span class="strength-bar"></span>
                            <span class="strength-bar"></span>
                            <span class="strength-bar"></span>
                            <span class="strength-bar"></span>

                        </div>

                        <div
                            class="strength-label"
                            id="strengthLabel"
                        >
                            Use at least 8 characters.
                        </div>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="field">

                    <div class="field-label">

                        <label for="confirmPassword">
                            CONFIRM PASSWORD
                        </label>

                    </div>


                    <div class="input-wrap">

                        <i
                            class="input-icon fa-solid fa-lock"
                        ></i>


                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            autocomplete="new-password"
                            minlength="8"
                            disabled
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                            aria-label="Show password"
                            disabled
                        >

                            <i
                                class="fa-solid fa-eye"
                            ></i>

                        </button>

                    </div>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="reset-btn"
                    id="resetBtn"
                    disabled
                >

                    <span id="resetBtnText">
                        Verify reset link first
                    </span>

                </button>


            </form>


            <!-- BACK -->

            <a
                href="login.html"
                class="back-login"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Back to login

            </a>


        </section>


        <!-- FOOTER -->

        <div class="login-footer">

            <i class="fa-solid fa-shield-halved"></i>

            Maison Hair Admin · Secure access

        </div>


    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        "use strict";


        /* =========================================================
           SUPABASE
        ========================================================= */

        const SUPABASE_URL =
    "https://upvbaagmusbrqbbcdudv.supabase.co";

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwdmJhYWdtdXNicnFiYmNkdWR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MDg0ODAsImV4cCI6MjEwNjE4NDQ4MH0.2H4c-v3CCT7bj5AaNRs366_cmZAb1RGg1X78WFkTndg";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY,
                {
                    auth: {
                        flowType: "implicit",
                        detectSessionInUrl: true,
                        persistSession: true,
                        autoRefreshToken: true
                    }
                }
            );


        /* =========================================================
           ELEMENTS
        ========================================================= */

        const resetForm =
            document.getElementById(
                "resetForm"
            );


        const resetBtn =
            document.getElementById(
                "resetBtn"
            );


        const resetBtnText =
            document.getElementById(
                "resetBtnText"
            );


        const resetMessage =
            document.getElementById(
                "resetMessage"
            );


        const messageIcon =
            document.getElementById(
                "messageIcon"
            );


        const messageText =
            document.getElementById(
                "messageText"
            );


        const linkStatus =
            document.getElementById(
                "linkStatus"
            );


        const linkStatusText =
            document.getElementById(
                "linkStatusText"
            );


        const newPassword =
            document.getElementById(
                "newPassword"
            );


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            );


        const strengthBars =
            document.querySelectorAll(
                ".strength-bar"
            );


        const strengthLabel =
            document.getElementById(
                "strengthLabel"
            );


        const passwordToggles =
            document.querySelectorAll(
                ".password-toggle"
            );


        let recoveryReady = false;

        let passwordUpdateRunning = false;


        /* =========================================================
           HELPERS
        ========================================================= */

        function showMessage(
            message,
            type
        ) {

            resetMessage.className =
                `message active ${type}`;


            messageText.textContent =
                message;


            messageIcon.className =
                type === "success"
                    ? "fa-solid fa-circle-check"
                    : "fa-solid fa-circle-exclamation";

        }


        function hideMessage() {

            resetMessage.className =
                "message";

            messageText.textContent = "";

        }


        function setLinkStatus(
            state,
            text
        ) {

            linkStatus.className =
                "link-status";


            if (state === "ready") {

                linkStatus.classList.add(
                    "ready"
                );

                linkStatus.innerHTML = `
                    <i class="fa-solid fa-circle-check"></i>
                    <span>${text}</span>
                `;

            }

            else if (state === "error") {

                linkStatus.classList.add(
                    "error"
                );

                linkStatus.innerHTML = `
                    <i class="fa-solid fa-circle-xmark"></i>
                    <span>${text}</span>
                `;

            }

            else {

                linkStatus.innerHTML = `
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                    <span>${text}</span>
                `;

            }

        }


        function enablePasswordForm() {

            recoveryReady = true;


            newPassword.disabled =
                false;


            confirmPassword.disabled =
                false;


            passwordToggles.forEach(
                button => {
                    button.disabled = false;
                }
            );


            resetBtn.disabled =
                false;


            resetBtnText.textContent =
                "Update password";


            setLinkStatus(
                "ready",
                "Reset link verified. You can create a new password."
            );

        }


        function disablePasswordForm() {

            recoveryReady = false;


            newPassword.disabled =
                true;


            confirmPassword.disabled =
                true;


            passwordToggles.forEach(
                button => {
                    button.disabled = true;
                }
            );


            resetBtn.disabled =
                true;

        }


        /* =========================================================
           PASSWORD STRENGTH
        ========================================================= */

        function updatePasswordStrength(
            password
        ) {

            let score = 0;


            if (password.length >= 8) {
                score++;
            }


            if (/[a-z]/.test(password)) {
                score++;
            }


            if (/[A-Z]/.test(password)) {
                score++;
            }


            if (
                /[0-9]/.test(password) ||
                /[^A-Za-z0-9]/.test(password)
            ) {
                score++;
            }


            strengthBars.forEach(
                (bar, index) => {

                    bar.style.background =
                        index < score
                            ? "rgba(241,238,232,.72)"
                            : "rgba(255,255,255,.08)";

                }
            );


            if (!password.length) {

                strengthLabel.textContent =
                    "Use at least 8 characters.";

            }

            else if (score === 1) {

                strengthLabel.textContent =
                    "Very weak password.";

            }

            else if (score === 2) {

                strengthLabel.textContent =
                    "Weak password.";

            }

            else if (score === 3) {

                strengthLabel.textContent =
                    "Good password.";

            }

            else {

                strengthLabel.textContent =
                    "Strong password.";

            }

        }


        newPassword.addEventListener(
            "input",
            () => {

                updatePasswordStrength(
                    newPassword.value
                );

            }
        );


        /* =========================================================
           PASSWORD VISIBILITY
        ========================================================= */

        passwordToggles.forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const targetId =
                            button.dataset.target;


                        const input =
                            document.getElementById(
                                targetId
                            );


                        const icon =
                            button.querySelector(
                                "i"
                            );


                        const showing =
                            input.type ===
                            "text";


                        input.type =
                            showing
                                ? "password"
                                : "text";


                        icon.className =
                            showing
                                ? "fa-solid fa-eye"
                                : "fa-solid fa-eye-slash";


                        button.setAttribute(
                            "aria-label",
                            showing
                                ? "Show password"
                                : "Hide password"
                        );

                    }
                );

            }
        );


        /* =========================================================
           CLEAN RECOVERY URL
        ========================================================= */

        function cleanRecoveryUrl() {

            try {

                if (
                    window.location.hash ||
                    window.location.search
                ) {

                    window.history.replaceState(
                        {},
                        document.title,
                        window.location.pathname
                    );

                }

            } catch (error) {

                console.warn(
                    "[Maison] Could not clean recovery URL:",
                    error
                );

            }

        }


        /* =========================================================
           AUTH STATE
        ========================================================= */

        supabaseClient.auth.onAuthStateChange(
            async (event, session) => {

                console.log(
                    "[Maison] Auth event:",
                    event
                );


                /*
                 * This is the important event for
                 * password recovery.
                 */

                if (
                    event ===
                    "PASSWORD_RECOVERY"
                    &&
                    session
                ) {

                    enablePasswordForm();

                    cleanRecoveryUrl();

                    return;

                }


                /*
                 * If Supabase has already restored
                 * a valid session.
                 */

                if (
                    event ===
                    "INITIAL_SESSION"
                    &&
                    session
                    &&
                    !recoveryReady
                ) {

                    enablePasswordForm();

                    return;

                }

            }
        );


        /* =========================================================
           INITIAL RECOVERY CHECK
        ========================================================= */

        async function checkRecoverySession() {

            try {

                /*
                 * Give Supabase a moment to process
                 * the recovery token from the URL.
                 */

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            350
                        )
                );


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .getSession();


                if (error) {

                    throw error;

                }


                /*
                 * If the PASSWORD_RECOVERY event
                 * already enabled the form, we're done.
                 */

                if (recoveryReady) {

                    return;

                }


                if (data.session) {

                    enablePasswordForm();

                    return;

                }


                /*
                 * No session means the user did not
                 * arrive through a valid recovery link.
                 */

                disablePasswordForm();


                setLinkStatus(
                    "error",
                    "This password reset link is missing, invalid, or expired."
                );


                showMessage(
                    "Open the password reset email again and use the newest reset link.",
                    "error"
                );

            } catch (error) {

                console.error(
                    "[Maison] Recovery session check failed:",
                    error
                );


                disablePasswordForm();


                setLinkStatus(
                    "error",
                    "We could not verify this password reset link."
                );


                showMessage(
                    error.message ||
                    "The password reset link could not be verified.",
                    "error"
                );

            }

        }


        /* =========================================================
           PASSWORD UPDATE
        ========================================================= */

        resetForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                if (
                    !recoveryReady ||
                    passwordUpdateRunning
                ) {

                    return;

                }


                const password =
                    newPassword.value;


                const confirmation =
                    confirmPassword.value;


                hideMessage();


                if (password.length < 8) {

                    showMessage(
                        "Your password must contain at least 8 characters.",
                        "error"
                    );

                    newPassword.focus();

                    return;

                }


                if (
                    password !==
                    confirmation
                ) {

                    showMessage(
                        "The passwords do not match.",
                        "error"
                    );

                    confirmPassword.focus();

                    return;

                }


                passwordUpdateRunning =
                    true;


                resetBtn.disabled =
                    true;


                resetBtn.innerHTML = `
                    <span class="spinner"></span>
                    <span>Updating...</span>
                `;


                try {

                    /*
                     * Confirm that the recovery
                     * session still exists.
                     */

                    const {
                        data,
                        error:
                            sessionError
                    } =
                        await supabaseClient.auth
                            .getSession();


                    if (sessionError) {

                        throw sessionError;

                    }


                    if (!data.session) {

                        throw new Error(
                            "Your password reset session has expired. Please request a new reset link."
                        );

                    }


                    /*
                     * Update the authenticated user's
                     * password.
                     */

                    const {
                        error
                    } =
                        await supabaseClient.auth
                            .updateUser({
                                password
                            });


                    if (error) {

                        throw error;

                    }


                    showMessage(
                        "Password updated successfully. Redirecting you to login...",
                        "success"
                    );


                    resetForm.reset();


                    updatePasswordStrength(
                        ""
                    );


                    setTimeout(
                        () => {

                            window.location.replace(
                                "login.html"
                            );

                        },
                        1800
                    );

                } catch (error) {

                    console.error(
                        "[Maison] Password update failed:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Could not update your password. Please request a new reset link.",
                        "error"
                    );


                    passwordUpdateRunning =
                        false;


                    resetBtn.disabled =
                        false;


                    resetBtn.innerHTML = `
                        <span>Update password</span>
                    `;

                }

            }
        );


        /* =========================================================
           START
        ========================================================= */

        checkRecoverySession();

    </script>

</body>
