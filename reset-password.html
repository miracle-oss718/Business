<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Maison Hair — Reset Password</title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <style>

        :root {

            --black: #0b0b0b;
            --black-soft: #121212;

            --white: #f1eee8;
            --white-soft: #d8d4cc;

            --grey: #858585;

            --border:
                rgba(255,255,255,.09);

        }


        * {

            box-sizing: border-box;

            margin: 0;
            padding: 0;

        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255,255,255,.045),
                    transparent 40%
                ),
                var(--black);

            color: var(--white);

            font-family:
                "DM Sans",
                sans-serif;

        }


        .reset-shell {

            width:
                min(420px, 100%);

        }


        .brand {

            text-align: center;

            margin-bottom: 30px;

        }


        .brand-mark {

            width: 52px;
            height: 52px;

            margin:
                0 auto 16px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background:
                rgba(255,255,255,.055);

            border:
                1px solid var(--border);

            color: var(--white);

            font-family:
                "Manrope",
                sans-serif;

            font-size: 18px;
            font-weight: 700;

            box-shadow:
                inset
                0 1px 0
                rgba(255,255,255,.05),

                0 15px 40px
                rgba(0,0,0,.3);

        }


        .brand h1 {

            font-family:
                "Manrope",
                sans-serif;

            font-size: 21px;

            font-weight: 700;

            letter-spacing: -.5px;

        }


        .brand p {

            margin-top: 6px;

            color: var(--grey);

            font-size: 11px;

        }


        .reset-card {

            padding: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(29,29,29,.96),
                    rgba(15,15,15,.98)
                );

            border:
                1px solid var(--border);

            border-radius: 20px;

            box-shadow:
                0 30px 90px
                rgba(0,0,0,.55),

                inset
                0 1px 0
                rgba(255,255,255,.035);

        }


        .reset-card h2 {

            font-family:
                "Manrope",
                sans-serif;

            font-size: 20px;

            letter-spacing: -.4px;

        }


        .reset-card > p {

            margin-top: 7px;

            margin-bottom: 24px;

            color: var(--grey);

            font-size: 11px;

            line-height: 1.6;

        }


        .field {

            margin-bottom: 16px;

        }


        .field label {

            display: block;

            margin-bottom: 7px;

            color: var(--white-soft);

            font-size: 10px;

            font-weight: 600;

        }


        .input-wrap {

            position: relative;

        }


        .input-wrap i {

            position: absolute;

            left: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            color: var(--grey);

            font-size: 12px;

        }


        .input-wrap input {

            width: 100%;

            height: 46px;

            padding:
                0 14px 0 40px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 10px;

            outline: none;

            background:
                rgba(255,255,255,.035);

            color: var(--white);

            font-family: inherit;

            font-size: 12px;

            transition:
                border-color .2s ease,
                background .2s ease;

        }


        .input-wrap input:focus {

            border-color:
                rgba(255,255,255,.22);

            background:
                rgba(255,255,255,.05);

        }


        .input-wrap input::placeholder {

            color: #606060;

        }


        .reset-btn {

            width: 100%;

            height: 46px;

            margin-top: 8px;

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius: 10px;

            background:
                var(--white);

            color:
                var(--black);

            font-family: inherit;

            font-size: 11px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform .2s ease,
                opacity .2s ease;

        }


        .reset-btn:hover {

            opacity: .9;

        }


        .reset-btn:active {

            transform:
                scale(.98);

        }


        .reset-btn:disabled {

            opacity: .5;

            cursor: not-allowed;

        }


        .message {

            display: none;

            margin-bottom: 15px;

            padding: 11px 12px;

            border-radius: 9px;

            font-size: 10px;

            line-height: 1.5;

        }


        .message.active {

            display: block;

        }


        .message.error {

            border:
                1px solid
                rgba(255,90,90,.18);

            background:
                rgba(255,70,70,.055);

            color:
                #ff9a9a;

        }


        .message.success {

            border:
                1px solid
                rgba(255,255,255,.10);

            background:
                rgba(255,255,255,.04);

            color:
                var(--white-soft);

        }


        .back-login {

            display: block;

            margin-top: 18px;

            text-align: center;

            color: var(--grey);

            font-size: 10px;

            text-decoration: none;

            transition:
                color .2s ease;

        }


        .back-login:hover {

            color: var(--white);

        }


        .login-footer {

            margin-top: 20px;

            text-align: center;

            color: #555;

            font-size: 9px;

        }


        @media (max-width: 480px) {

            .reset-card {

                padding:
                    23px 19px;

                border-radius: 17px;

            }

        }

    </style>

</head>


<body>


    <main class="reset-shell">


        <div class="brand">

            <div class="brand-mark">
                MH
            </div>

            <h1>
                Maison Hair
            </h1>

            <p>
                Administration Portal
            </p>

        </div>


        <div class="reset-card">

            <h2>
                Create a new password
            </h2>

            <p>
                Choose a new password for your Maison Hair administrator account.
            </p>


            <div
                class="message"
                id="resetMessage"
            ></div>


            <form id="resetForm">


                <div class="field">

                    <label for="newPassword">
                        NEW PASSWORD
                    </label>

                    <div class="input-wrap">

                        <i
                            class="fa-solid fa-lock"
                        ></i>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                    </div>

                </div>


                <div class="field">

                    <label for="confirmPassword">
                        CONFIRM PASSWORD
                    </label>

                    <div class="input-wrap">

                        <i
                            class="fa-solid fa-lock"
                        ></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="reset-btn"
                    id="resetBtn"
                >
                    Update password
                </button>


            </form>


            <a
                href="login.html"
                class="back-login"
            >
                ← Back to login
            </a>

        </div>


        <div class="login-footer">
            Maison Hair Admin · Secure access
        </div>


    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        "use strict";


        const SUPABASE_URL =
            "https://upvbaagmusbrqbbcdudv.supabase.co";


        const SUPABASE_KEY =
            "PASTE_THE_SAME_ANON_KEY_FROM_ADMIN_JS_HERE";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const resetForm =
            document.getElementById(
                "resetForm"
            );


        const resetBtn =
            document.getElementById(
                "resetBtn"
            );


        const resetMessage =
            document.getElementById(
                "resetMessage"
            );


        function showMessage(
            message,
            type
        ) {

            resetMessage.textContent =
                message;

            resetMessage.className =
                `message active ${type}`;

        }


        resetForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const newPassword =
                    document
                        .getElementById(
                            "newPassword"
                        )
                        .value;


                const confirmPassword =
                    document
                        .getElementById(
                            "confirmPassword"
                        )
                        .value;


                if (newPassword.length < 8) {

                    showMessage(
                        "Password must be at least 8 characters long.",
                        "error"
                    );

                    return;

                }


                if (
                    newPassword !==
                    confirmPassword
                ) {

                    showMessage(
                        "The passwords do not match.",
                        "error"
                    );

                    return;

                }


                resetBtn.disabled =
                    true;

                resetBtn.textContent =
                    "Updating...";


                try {

                    const {
                        error
                    } =
                        await supabaseClient.auth
                            .updateUser({
                                password:
                                    newPassword
                            });


                    if (error) {
                        throw error;
                    }


                    showMessage(
                        "Your password has been updated successfully.",
                        "success"
                    );


                    resetForm.reset();


                    setTimeout(
                        () => {

                            window.location.replace(
                                "login.html"
                            );

                        },
                        1800
                    );


                } catch (error) {

                    console.error(
                        "[Maison] Password update failed:",
                        error
                    );


                    showMessage(
                        error.message ||
                        "Could not update your password.",
                        "error"
                    );


                    resetBtn.disabled =
                        false;

                    resetBtn.textContent =
                        "Update password";

                }

            }
        );

    </script>

</body>

</html>
